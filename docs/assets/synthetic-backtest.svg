<svg xmlns="http://www.w3.org/2000/svg" width="800" height="350" viewBox="0 0 800 350" role="img" aria-labelledby="title description">
  <title id="title">Synthetic backtest equity</title>
  <desc id="description">From an initial 100 INR, the strategy ends at 99 INR and the buy-and-hold benchmark ends at 99.90 INR. Points after the initial balance are measured at candle closes.</desc>
  <rect x="1" y="1" width="798" height="348" rx="15" fill="#0b1c29" stroke="#243b4a"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
    <text x="30" y="42" fill="#f3f6f8" font-size="25" font-weight="650">Equity in a synthetic backtest</text>
    <text x="30" y="67" fill="#b0c5d0" font-size="14">Initial balance and three candle closes</text>

    <g font-size="14" fill="#e1edf1">
      <path d="M470 59h26" stroke="#65d8c4" stroke-width="3.5" stroke-linecap="round"/>
      <text x="505" y="64">Strategy</text>
      <path d="M595 59h26" stroke="#f7b76b" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="5 6"/>
      <text x="630" y="64">Buy and hold</text>
    </g>

    <g stroke="#294452" stroke-width="1">
      <path d="M120 122H678 M120 170H678 M120 218H678 M120 266H678"/>
      <path d="M120 122V289 M306 122V289 M492 122V289 M678 122V289" stroke-dasharray="2 5"/>
    </g>

    <g fill="#b0c5d0" font-size="14">
      <text x="30" y="103">Equity (INR)</text>
      <g text-anchor="end">
        <text x="103" y="127">100.50</text>
        <text x="103" y="175">100.00</text>
        <text x="103" y="223">99.50</text>
        <text x="103" y="271">99.00</text>
      </g>
      <g text-anchor="middle">
        <text x="120" y="309">Start</text>
        <text x="306" y="309">1</text>
        <text x="492" y="309">2</text>
        <text x="678" y="309">3</text>
        <text x="399" y="332">Replay step</text>
      </g>
    </g>

    <g fill="none" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="120,170 306,131.6 492,189.2 678,179.6" stroke="#f7b76b" stroke-dasharray="5 6"/>
      <polyline points="120,170 306,170 492,228 678,266" stroke="#65d8c4"/>
    </g>
    <g fill="#f7b76b">
      <circle cx="306" cy="131.6" r="4"/>
      <circle cx="492" cy="189.2" r="4"/>
      <circle cx="678" cy="179.6" r="4"/>
    </g>
    <g fill="#65d8c4">
      <circle cx="120" cy="170" r="4"/>
      <circle cx="306" cy="170" r="4"/>
      <circle cx="492" cy="228" r="4"/>
      <circle cx="678" cy="266" r="4"/>
    </g>
    <g font-size="15" font-weight="650">
      <text x="696" y="185" fill="#f7b76b">99.90</text>
      <text x="696" y="271" fill="#65d8c4">99.00</text>
    </g>
  </g>
</svg>
